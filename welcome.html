<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultline — Welcome Portal</title>
<meta name="description" content="Your cosmic time capsule command center.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="starfield"></canvas>
<div class="void-gradient"></div>

<div class="wrap">
  <header class="topbar">
    <div class="brand"><span class="glyph"></span> VAULTLINE PORTAL</div>
    <div class="auth-area" id="authArea">
      <!-- Injected dynamically by app.js -->
    </div>
  </header>

  <main id="dashboard">
    <section class="panel">
      <h2>Seal a new capsule</h2>
      <div class="sub">Set a duration, write the message, seal it into the void.</div>

      <form id="capsuleForm">
        <div class="field">
          <label>Title</label>
          <input type="text" id="capsuleTitle" placeholder="e.g. Board exam prediction" maxlength="80">
        </div>

        <div class="field">
          <label>Message (revealed on unlock)</label>
          <textarea id="capsuleMessage" placeholder="What are you sealing away?" maxlength="2000"></textarea>
        </div>

        <div class="row3">
          <div class="field">
            <label>Duration</label>
            <input type="number" id="capsuleAmount" min="1" placeholder="e.g. 30">
          </div>
          <div class="field">
            <label>Unit</label>
            <select id="capsuleUnit">
              <option value="minute">Minutes</option>
              <option value="hour">Hours</option>
              <option value="day">Days</option>
              <option value="year" selected>Years</option>
            </select>
          </div>
          <div class="field">
            <label>Visibility</label>
            <select id="capsuleVisibility">
              <option value="private">Private</option>
              <option value="public">Public</option>
            </select>
          </div>
        </div>

        <div style="margin-top:18px; display:flex; justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Seal capsule</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Your capsules</h2>
      <div class="sub">Manage visibility, copy links, or delete your time vaults.</div>
      <div id="capsuleList"></div>
    </section>
  </main>
</div>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
